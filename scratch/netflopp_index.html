    <!-- Synchronous top-level PWA event capturing to guarantee deferredPrompt is never missed -->
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
        console.log('NetFlop Capture: beforeinstallprompt triggered and captured successfully!');
      });
    </script>
    
    <!-- Dynamic high-resolution iOS & App Icon Generator (NetFlop Theme) -->
    <script>
      (function() {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');
          
          if (!ctx) return;

          // Background: Deep vibrant dark-red/black gradient matching the web app theme
          const bgGrad = ctx.createRadialGradient(256, 256, 20, 256, 256, 360);
          bgGrad.addColorStop(0, '#1a0508'); // Crimson highlight
          bgGrad.addColorStop(1, '#050203'); // Rich deep black
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, 512, 512);

          // NetFlop Ribbon 'N' Coordinates
          const yStart = 110;
          const yEnd = 402;
          const colWidth = 66;
          const leftX = 160;
          const rightX = 286;

          // Left Pillar
          const leftGrad = ctx.createLinearGradient(0, yStart, 0, yEnd);
          leftGrad.addColorStop(0, '#e50914');
          leftGrad.addColorStop(1, '#80050a');
          ctx.fillStyle = leftGrad;
          ctx.beginPath();
          ctx.rect(leftX, yStart, colWidth, yEnd - yStart);
          ctx.fill();

          // Right Pillar
          const rightGrad = ctx.createLinearGradient(0, yStart, 0, yEnd);
          rightGrad.addColorStop(0, '#e50914');
          rightGrad.addColorStop(1, '#80050a');
          ctx.fillStyle = rightGrad;
          ctx.beginPath();
          ctx.rect(rightX, yStart, colWidth, yEnd - yStart);
          ctx.fill();

          // Underlay 3D folding shadow beneath the diagonal
          ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
          ctx.shadowBlur = 18;
          ctx.shadowOffsetX = 8;
          ctx.shadowOffsetY = 6;

          // Diagonal Pillar (Drawn over the shadow) - Reversed N direction (Cyrillic И)
          const diagGrad = ctx.createLinearGradient(leftX, yEnd, rightX + colWidth, yStart);
          diagGrad.addColorStop(0, '#ff252f'); // Ultra-vibrant highlight at bottom-left fold
          diagGrad.addColorStop(0.5, '#e50914'); // NetFlop Crimson Red
          diagGrad.addColorStop(1, '#a0060d'); // Shadowed fold at top-right
          ctx.fillStyle = diagGrad;

          ctx.beginPath();
          ctx.moveTo(leftX, yEnd);
          ctx.lineTo(leftX + colWidth, yEnd);
          ctx.lineTo(rightX + colWidth, yStart);
          ctx.lineTo(rightX, yStart);
          ctx.closePath();
          ctx.fill();

          // Reset Shadow context
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 0;

          const dataUrl = canvas.toDataURL('image/png');

          // 1. Set Bookmark / Shortcut Favicons (PNG and touch icons)
          const appleIcon = document.createElement('link');
          appleIcon.rel = 'apple-touch-icon';
          appleIcon.href = dataUrl;
          document.head.appendChild(appleIcon);

          const appleIconPrecom = document.createElement('link');
          appleIconPrecom.rel = 'apple-touch-icon-precomposed';
          appleIconPrecom.href = dataUrl;
          document.head.appendChild(appleIconPrecom);

          const iconLink = document.querySelector("link[rel='icon']");
          if (iconLink) {
            iconLink.href = dataUrl;
            iconLink.type = 'image/png';
          }

          // 2. Add Mobile Web App Meta tags for seamless Home Screen loading
          const metaCapable = document.createElement('meta');
          metaCapable.name = 'apple-mobile-web-app-capable';
          metaCapable.content = 'yes';
          document.head.appendChild(metaCapable);

          const metaStatus = document.createElement('meta');
          metaStatus.name = 'apple-mobile-web-app-status-bar-style';
          metaStatus.content = 'black-translucent';
          document.head.appendChild(metaStatus);

          const metaTitle = document.createElement('meta');
          metaTitle.name = 'apple-mobile-web-app-title';
          metaTitle.content = 'NetFlop';
          document.head.appendChild(metaTitle);

          // 3. Inject PWA Manifest from the static server route to meet Chromium installability standards
          const manifestLink = document.createElement('link');
          manifestLink.rel = 'manifest';
          manifestLink.href = '/manifest.json';
          document.head.appendChild(manifestLink);

          // 4. Register the Service Worker for native installation prompt support
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('NetFlop SW Registered successfully!', reg.scope))
                .catch(err => console.error('NetFlop SW Registration failed:', err));
            });
          }

        } catch (e) {
          console.error("Dynamic Touch Icon Generation Failed", e);
        }
      })();
    </script>
