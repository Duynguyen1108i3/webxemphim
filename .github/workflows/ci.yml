name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: streamforge
          POSTGRES_PASSWORD: streamforge
          POSTGRES_DB: streamforge_test
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm test
        env:
          DATABASE_URL: postgresql://streamforge:streamforge@localhost:5432/streamforge_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
          COOKIE_SECRET: ci-cookie-secret
