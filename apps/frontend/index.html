<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="StreamForge — Watch movies, TV shows, and anime online with high-quality streaming and smart recommendations." />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Dela+Gothic+One&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>StreamForge — Watch Movies & TV Shows Online</title>

  <body class="bg-[#141414] text-white">
    <div id="root"><div id="initial-splash" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#141414;gap:24px"><style>#initial-splash .sf-logo{font-family:'Anton','Dela Gothic One',sans-serif;font-size:2.4rem;font-weight:900;color:#e50914;letter-spacing:-.02em;animation:sf-pulse 2s ease-in-out infinite}#initial-splash .sf-spinner{width:36px;height:36px;border:3px solid rgba(229,9,20,.2);border-top-color:#e50914;border-radius:50%;animation:sf-spin .8s linear infinite}@keyframes sf-spin{to{transform:rotate(360deg)}}@keyframes sf-pulse{0%,100%{opacity:1}50%{opacity:.6}}</style><span class="sf-logo">STREAMFORGE</span><div class="sf-spinner"></div><p style="color:rgba(255,255,255,.4);font-size:12px;font-family:Poppins,sans-serif;letter-spacing:.12em;text-transform:uppercase">Đang tải...</p></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
