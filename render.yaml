services:
  - type: web
    runtime: docker
    name: rytoxgroup-api
    region: singapore
    plan: free
    dockerfilePath: infrastructure/docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rytoxgroup-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rytoxgroup-cache
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SAME_SITE
        value: none
      - key: CORS_ORIGINS
        sync: false

  - type: keyvalue
    name: rytoxgroup-cache
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: rytoxgroup-db
    databaseName: rytoxgroup
    user: rytoxgroup
    region: singapore
    plan: free
